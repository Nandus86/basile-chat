# Auditoria semanal das dependências: confere as versões travadas (backend/requirements.lock e
# frontend/package-lock.json) contra as bases públicas de vulnerabilidades e de pacotes maliciosos.
# Se achar algo, o job falha e o GitHub avisa por e-mail.
name: auditoria-semanal

on:
  schedule:
    - cron: "0 11 * * 1"        # segunda-feira, 08:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pip-audit>=2.7,<3"
      - run: pip-audit --require-hashes --disable-pip -r backend/requirements.lock

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit (só o que vai para produção)
        working-directory: frontend
        run: npm audit --package-lock-only --omit=dev --audit-level=high
