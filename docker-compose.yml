services:
  # O app (PWA). O backend agora é o serviço "mensageiro" do basile_ia (backend/mensageiro).
  # A pasta backend/ deste repositório é a versão antiga (sem login) e não é mais usada.
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8014}
        NEXT_PUBLIC_WS_BASE: ${NEXT_PUBLIC_WS_BASE:-ws://localhost:8014}
    container_name: basile-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
